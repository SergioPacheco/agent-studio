name: Verify Agent Studio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: docker pull node:22-alpine
      - run: npm test
        env:
          RUN_DOCKER_TESTS: '1'

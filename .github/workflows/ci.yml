name: Verify Agent Studio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: docker pull node:22-alpine
      - run: npm test
        env:
          RUN_DOCKER_TESTS: '1'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node test/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-screenshots
          path: .studio/screenshots/
          include-hidden-files: true
          if-no-files-found: ignore
